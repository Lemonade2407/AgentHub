services:
  postgres:
    image: postgres:16-alpine
    container_name: agenthub-postgres
    environment:
      POSTGRES_DB: agenthub
      POSTGRES_USER: agenthub
      POSTGRES_PASSWORD: agenthub
    ports:
      # 5432 被本机其他 PostgreSQL 占用时，可用 AGENTHUB_DB_PORT=5433 覆盖
      - "${AGENTHUB_DB_PORT:-5432}:5432"
    volumes:
      - agenthub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenthub -d agenthub"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  agenthub_pgdata:
